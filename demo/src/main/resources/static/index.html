<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Task Manager | Productivity Redefined</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Auth Section -->
        <div id="auth-section" class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Please login to manage your tasks</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <div class="auth-footer">
                    Don't have an account? <a href="#" id="toggle-auth">Register</a>
                </div>
            </form>
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <div class="auth-footer">
                    Already have an account? <a href="#" id="toggle-auth-back">Sign In</a>
                </div>
            </form>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboard-section" class="dashboard-container hidden">
            <header class="dashboard-header">
                <div class="user-info">
                    <span class="user-avatar">?</span>
                    <span id="user-display-email">user@demo.com</span>
                </div>
                <button id="logout-btn" class="btn-secondary">Logout</button>
            </header>
            
            <main class="dashboard-main">
                <div class="tasks-header">
                    <h2>My Tasks</h2>
                    <p id="task-stats">You have 0 tasks pending</p>
                </div>

                <div class="add-task-bar">
                    <input type="text" id="new-task-title" placeholder="What needs to be done?">
                    <button id="add-task-btn" class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <div id="tasks-list" class="tasks-grid">
                    <!-- Tasks will be injected here -->
                    <div class="task-skeleton"></div>
                    <div class="task-skeleton"></div>
                    <div class="task-skeleton"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
